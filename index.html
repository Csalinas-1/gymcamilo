<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LAZCAKONGYM" />
    <meta name="theme-color" content="#090d16" />
    <meta name="description" content="LAZCAKONGYM - App de entrenamiento personalizada con temporizadores y registro en tiempo real" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <body class="bg-[#090d16] text-slate-100 font-['Plus_Jakarta_Sans',sans-serif] antialiased select-none overflow-x-hidden">
    <div id="root"></div>
    <div style="background-color: #1e1e1e; border-radius: 8px; padding: 20px; margin: 20px 0; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
    <h2 style="font-size: 18px; color: #ffffff; margin-top: 0;">📊 Informes y Comparativas de Progreso</h2>
    <p style="color: #b0b0b0; font-size: 14px;">Evolución de cargas y rendimiento del atleta mes a mes.</p>
    
    <table style="width: 100%; border-collapse: collapse; margin-top: 10px; text-align: center;">
        <thead>
            <tr style="background-color: #2c2c2c; color: #4CAF50;">
                <th style="padding: 12px; border-bottom: 1px solid #333;">Ejercicio / Métrica</th>
                <th style="padding: 12px; border-bottom: 1px solid #333;">Mes Anterior</th>
                <th style="padding: 12px; border-bottom: 1px solid #333;">Mes Actual</th>
                <th style="padding: 12px; border-bottom: 1px solid #333;">Evolución</th>
            </tr>
        </thead>
        <tbody>
            <tr style="border-bottom: 1px solid #333;">
                <td style="padding: 12px;">Sentadilla Libre (Squat)</td>
                <td style="padding: 12px;">80 kg</td>
                <td style="padding: 12px;">95 kg</td>
                <td style="padding: 12px; color: #4CAF50; font-weight: bold;">+15 kg 🚀</td>
            </tr>
            <tr style="border-bottom: 1px solid #333;">
                <td style="padding: 12px;">Press de Banca</td>
                <td style="padding: 12px;">60 kg</td>
                <td style="padding: 12px;">70 kg</td>
                <td style="padding: 12px; color: #4CAF50; font-weight: bold;">+10 kg 💪</td>
            </tr>
            <tr>
                <td style="padding: 12px;">Peso Corporal / Definición</td>
                <td style="padding: 12px;">75.5 kg</td>
                <td style="padding: 12px;">74.2 kg</td>
                <td style="padding: 12px; color: #4CAF50; font-weight: bold;">-1.3 kg 📉</td>
            </tr>
        </tbody>
    </table>
</div>
    <script type="module" src="/src/main.tsx"></script>
